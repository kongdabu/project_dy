services:
  - type: web
    name: medstudy-portal-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: qwen/qwen3.7-flash
      - key: STT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3
      - key: STT_LANGUAGE
        value: ko
      - key: STT_POST_EDIT
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORTAL_PASSCODE
        sync: false
      - key: AUTH_SECRET
        sync: false

